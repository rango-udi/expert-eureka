# Literal fictional inputs, including all test passwords.
schema_version: 1
description: Customer black-box UI specification; isolated negative probes and one
  continuous registered-customer order.
quantity_product: fuzcake-rose-nocturne
order_products:
- fuzcake-the-one
- fuzcake-homme-ideal
- fuzcake-rose-aube
billing_address: customer-home
shipping_address: customer-office
quantity_model:
  schema_version: 1
  fields:
    quantity:
      nominal: '3'
      min: '1'
      max: '25'
      step: '1'
      partitions:
      - id: in_stock
        valid: true
        representative: '3'
        min: '1'
        max: '25'
      - id: below
        valid: false
        representative: '0'
        below: '1'
      - id: above_stock
        valid: false
        representative: '26'
        above: '25'
      - id: missing
        valid: false
        representative: ''
        values:
        - ''
      - id: fraction
        valid: false
        representative: '1.5'
        values:
        - '1.5'
  fault_policy: single
negative_cases:
- id: SH-CUST-R01
  stage: registration
  field: username
  value: ''
  title: Registration with an empty username
  description: The customer submits registration with the username field empty; the
    email and both passwords retain valid values.
  expected: rejected
  covers:
  - EP-R01
- id: SH-CUST-R02
  stage: registration
  field: username
  value: lucas parker
  title: Registration with a username containing a space
  description: The customer submits registration with a space in the username; the
    email and both passwords retain valid values.
  expected: rejected
  covers:
  - EP-R02
- id: SH-CUST-R03
  stage: registration
  field: username
  value: oliver.bennett
  title: Registration with an existing username
  description: The customer submits registration with a username belonging to an existing
    account, a new email and matching passwords.
  expected: rejected
  covers:
  - EP-R03
- id: SH-CUST-R04
  stage: registration
  field: email
  value: ''
  title: Registration with an empty email
  description: The customer submits registration with the email field empty; the username
    and both passwords retain valid values.
  expected: rejected
  covers:
  - EP-R04
- id: SH-CUST-R05
  stage: registration
  field: email
  value: lucas.parker.fuzcake.test
  title: Registration with an email missing the at sign
  description: The customer submits registration with an email missing @; the username
    and both passwords retain valid values.
  expected: rejected
  covers:
  - EP-R05
- id: SH-CUST-R06
  stage: registration
  field: password1
  value: ''
  title: Registration with an empty password
  description: The customer submits registration with the first password empty; the
    username, email and password confirmation retain valid values.
  expected: rejected
  covers:
  - EP-R06
- id: SH-CUST-R07
  stage: registration
  field: password2
  value: ''
  title: Registration with an empty password confirmation
  description: The customer submits registration with the confirmation empty; the
    username, email and first password retain valid values.
  expected: rejected
  covers:
  - EP-R07
- id: SH-CUST-R08
  stage: registration
  field: password2
  value: Lucas!7363Maple
  title: Registration with different passwords
  description: The customer submits registration with two different passwords and
    valid username and email values.
  expected: rejected
  covers:
  - EP-R08
- id: SH-CUST-L01
  stage: login
  field: username
  value: ''
  title: Login with an empty username
  description: The customer submits an empty username and the valid fixture account
    password.
  expected: rejected
  covers:
  - EP-L01
- id: SH-CUST-L02
  stage: login
  field: username
  value: nathan.reed
  title: Login with an unregistered username
  description: The customer submits a username outside the registered accounts and
    the fixture account password.
  expected: rejected
  covers:
  - EP-L02
- id: SH-CUST-L03
  stage: login
  field: password
  value: ''
  title: Login with an empty password
  description: The customer submits an activated username with the password field
    empty.
  expected: rejected
  covers:
  - EP-L03
- id: SH-CUST-L04
  stage: login
  field: password
  value: Oliver!0000Maple
  title: Login with a different account password
  description: The customer submits an activated username and a password different
    from its configured password.
  expected: rejected
  covers:
  - EP-L04
decision_rules:
- id: D-C01
  condition: coupon absent
  expected: No coupon discount; basket subtotal unchanged
- id: D-C02
  condition: coupon unknown
  expected: Visible native error; code not applied; total unchanged
- id: D-C03
  condition: coupon active
  expected: Configured welcome percentage applied exactly once
- id: D-C04
  condition: applied coupon removed
  expected: Discount removed and subtotal restored
- id: D-A01
  condition: same_as_billing true
  expected: Shipping inputs copy billing inputs
- id: D-A02
  condition: same_as_billing false
  expected: Independent shipping address retained
- id: D-S01
  condition: Careful delivery and COD selected
  expected: Discounted product subtotal plus the configured fee for the selected carrier
- id: D-S02
  condition: Priority delivery and COD selected
  expected: Discounted product subtotal plus the configured fee for the selected carrier
- id: D-S03
  condition: Express delivery and COD selected
  expected: Discounted product subtotal plus the configured fee for the selected carrier
- id: D-T01
  condition: terms unchecked, other inputs valid
  expected: Confirmation rejected; no success page
- id: D-T02
  condition: terms checked, other inputs valid
  expected: Order received; payment remains not paid; customer can reopen exact order
scope_exclusions:
- 'External paid-card gateway, declined cards and capture: not configured'
- 'Unavailable shipping/payment options: not reachable in seeded customer UI; no injected
  fake option'
- 'Email/password maximum length, password strength and all country/postal combinations:
  outside this declared model'
- 'Stock mutation/concurrency, all product combinations and order cancellation: separate
  integration or later models'
- 'Other-customer order authorization and every checkout combination: not established
  by the single new-customer order'
attribution:
  creator: rango-udi
  license: MIT
  scope: Test specification; shared fixture records retain CC-BY-4.0
final_carrier: fuzcake-delivery
fault_policy: single
