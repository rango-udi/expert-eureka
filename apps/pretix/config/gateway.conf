user nginx;
worker_processes 1;
pid /tmp/gateway.pid;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 18445;
        client_max_body_size 32m;
        location = /_cmdc/health { return 200 'ok'; }
        location / {
            # Resolve the backend at request time; gateway starts before pretix.
            set $backend http://pretix:8345;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_read_timeout 120s;
        }
    }
}
